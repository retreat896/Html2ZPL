name: Build Preview PNG

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-png-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/html2zpl-preview.log 2>&1 &
          curl --silent --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173 > /dev/null

      - name: Capture preview PNG
        run: npm run preview:screenshot

      - name: Upload preview PNG
        uses: actions/upload-artifact@v5
        with:
          name: preview-png
          path: frontend/public/HomePagePreview.png
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: preview-png-failure
          path: |
            frontend/public/HomePagePreview-failure.png
            /tmp/html2zpl-preview.log
          if-no-files-found: ignore
