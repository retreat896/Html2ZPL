name: Build Preview PNG

on:
  push:
    branches-ignore:
      - readme-assets
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-png-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/html2zpl-preview.log 2>&1 &
          curl --silent --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173 > /dev/null

      - name: Capture preview PNG
        run: npm run preview:screenshot

      - name: Upload preview PNG
        uses: actions/upload-artifact@v5
        with:
          name: preview-png
          path: frontend/public/HomePagePreview.png
          if-no-files-found: error

      # The README embeds the image from this branch, so main never gets bot commits.
      - name: Publish preview to readme-assets branch
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir readme-assets
          cp "$GITHUB_WORKSPACE/frontend/public/HomePagePreview.png" readme-assets/
          cd readme-assets
          git init --quiet --initial-branch readme-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HomePagePreview.png
          git commit --quiet --message "Update editor preview from ${GITHUB_SHA::7}"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" readme-assets

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: preview-png-failure
          path: |
            frontend/public/HomePagePreview-failure.png
            /tmp/html2zpl-preview.log
          if-no-files-found: ignore
